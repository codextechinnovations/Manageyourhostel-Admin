<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    h1 { font-size: 8rem; line-height: 1; }
    p { color: #94a3b8; margin: 1rem 0 2rem; }
    a, button {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
      border: none;
      font-size: 1rem;
    }
    .primary {
      background: linear-gradient(90deg, #2d2d7e, #1e3a8a);
      color: #fff;
      margin-right: 0.5rem;
    }
    .secondary {
      background: #1e293b;
      color: #fff;
    }
  </style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p>The page you are looking for doesn't exist or has been moved.</p>
    <div>
      <a href="/" class="primary">Go Home</a>
      <button class="secondary" onclick="history.back()">Go Back</button>
    </div>
  </div>
</body>
</html>
